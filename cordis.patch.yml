- insert:
    - id: dsh-memory
      name: dsh-memory
      # 需要 tools（注册记忆工具）；pre-step 钩子通过 ctx.on 挂，不强依赖 agents
      inject: [tools]
      config:
        # 🛑 这里不要写死盘符 / 绝对路径：本文件**随包发布**，别人的机器上没有 D 盘，
        #    dbPath 指过去会在 mkdirSync 抛 ENOENT，记忆库整个打不开（12 个工具全废）。
        #    dbPath 默认 <workspace>/.dsh-memory/memory.db，workspace 默认当前工作区，
        #    本机要特殊路径就在自己的 profile 里覆盖，别写进这个 patch。
        # 正式切换：前缀去掉，工具直接叫 memory_search / memory_remember …
        # 前提是 meow-memory 已禁用，否则重名会被 DSH 拒绝注册。
        toolPrefix: ''
        # 首轮注入：core 的身份与偏好全量 + 重要性>=2 的原则与禁令 + 项目名列表
        firstTurn: true
        # ⚠️ firstTurnMaxChars 这里**故意不写**，用代码里的默认值（16000）。
        #    写死数字有两个坑：① 覆盖掉代码默认值，改代码时以为生效了其实没有；
        #    ② 配小了会静默挤掉内容 —— 三段各有配额，加起来超过总预算时
        #    排在后面的段（偏好、项目清单）会一条都进不去，而且不报错。
        #    core 层长大了再按需在这里调大。
        # 每条消息命中：detail 层里按关键词打分取前 N 条
        # 先开这一路（只带 2 条，噪音可控），跟 meow-memory 当场对比效果
        hit: true
        hitTopK: 2
        # 命中按**项目**降权（v5，2026-11-20）。
        # 当前窗口**已激活项目**的条目权重 1，其他项目压到这个倍数。
        # 为什么按项目而不按域：域是靠关键词猜"这一轮在聊什么"，判错时会把该出现的
        # 记忆压下去；项目是 memory_remember 时**明确标的**，不存在猜错。
        # 0.7 = 温和（只挪排位）；0.5 = 激进；1 = 关掉。
        # 三条护栏：只降权不硬拦 / 没标项目的不参与 / 活跃项目为空时完全不降。
        projectDownweight: 0.7
        # 落档催办：上下文到水位时，往会话里排一条消息提醒模型先把状态写成落档。
        # 走 `agent.followup()`（独立回合），不打断当前这轮。
        # 想关掉就设 false —— 但关了就没人提醒你了。
        precompactNudge: true
