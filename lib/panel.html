<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">

<title>记忆中心</title><style>

/* 🕒 回落倒计时：显示"还有几轮没提到它就会被摘掉"。

padding:1px 5px;font-family:ui-monospace,monospace;white-space:nowrap;flex:none}
/* 只剩 1 轮：变暖色提醒，快掉了 */

/* 「🔓 放开」：手动固定状态下才出现的小按钮 */

background:rgba(124,157,255,.18);border-color:rgba(124,157,255,.45);color:#c9d8ff}

.ed{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:12px 14px;margin:10px 0 14px}

</style></head><body>
<div id="bgfix"></div>
<h1>🧠 记忆中心</h1>
<div id="stats" class="grid"></div>
<div id="plans"></div>
<div id="proj"><div class="muted">加载中…</div></div>
<div class="sep"></div>
<div class="row"><input id="q" placeholder="搜记忆…（回车）" autocomplete="off"><button id="go">搜</button><button id="tlbtn">时间轴</button><button id="addbtn">＋新增</button></div>
<div class="srow"><label><input type="checkbox" id="convchk" style="margin-right:6px;vertical-align:-1px">也搜历史对话原文</label><label style="margin-left:14px"><input type="checkbox" id="qarch" style="margin-right:6px;vertical-align:-1px">含已归档</label><span class="muted" id="convstat"></span></div>
<div id="editor"></div>
<div id="out"><div class="muted">上方输入关键词检索；不输入则看最近改动。</div></div>
<script>
function syncTheme(){
try{
var d=window.parent.document.documentElement;
if(!d)return;
var cs=window.parent.getComputedStyle(d);
var vs=["--dsw-alias-bg-base","--dsw-alias-bg-module-platform","--dsw-alias-bg-overlay",
"--dsw-alias-label-primary","--dsw-alias-label-secondary","--dsw-alias-label-tertiary",
"--dsw-alias-brand-primary","--dsw-alias-interactive-bg-hover","--dsw-alias-markdown-code-block"];
var root=document.documentElement;
for(var i=0;i<vs.length;i++){var v=cs.getPropertyValue(vs[i]);
if(v&&v.trim())root.style.setProperty(vs[i],v.trim())}
}catch(e){}
}
function syncBackdrop(){
try{
var pw=window.parent,pd=pw.document;
var pick="";
var cands=[pd.body,pd.documentElement,pd.querySelector("#root"),pd.querySelector("#app"),
pd.querySelector("[class*=skin]"),pd.querySelector("[class*=maid]")];
for(var i=0;i<cands.length&&!pick;i++){
var el=cands[i];if(!el)continue;
var bg=pw.getComputedStyle(el).backgroundImage;
if(bg&&bg!=="none"&&bg.indexOf("url(")>=0)pick=bg;
}
if(!pick){
var names=[];
try{
var maxSheets=Math.min(pd.styleSheets.length,12);
for(var s=0;s<maxSheets;s++){
var rules=null;
try{rules=pd.styleSheets[s].cssRules}catch(e2){continue}
if(!rules)continue;
var maxRules=Math.min(rules.length,800);
for(var r=0;r<maxRules;r++){
var t=rules[r].cssText||"";
var m=t.match(/--[a-zA-Z0-9_-]+/g);
if(m)for(var k=0;k<m.length;k++)if(names.indexOf(m[k])<0)names.push(m[k]);
}
}
}catch(e3){}
var cs=pw.getComputedStyle(pd.documentElement);
var csb=pd.body?pw.getComputedStyle(pd.body):null;
for(var n=0;n<names.length;n++){
var v=cs.getPropertyValue(names[n])||(csb?csb.getPropertyValue(names[n]):"");
v=(v||"").trim();
if(v&&v.indexOf("url(")>=0){pick=v;break}
}
}
if(!pick)return;
var box=document.getElementById("bgfix");
if(!box)return;
box.style.backgroundImage=pick.indexOf("url(")===0?pick:"url(\""+pick+"\")";
box.classList.add("on");
document.body.classList.add("hasskin");
}catch(e){}
}
var $=function(s){return document.querySelector(s)};
// 🛑 必须连双引号一起转义！
//    这个函数的结果被塞进 value="…" / data-n="…" / data-mode="…" / data-edit="…"
//    这类**双引号属性**里。原来只处理 & < >，于是：
//      · 任何含英文双引号的标题/项目名，在编辑器里 value 会被截断成第一个引号前的残片，
//        一保存就把原值覆盖成残片（不用恶意构造就丢数据）；
//      · 恶意名字可以闭合属性注入 onmouseover=…，而面板是同源 iframe，
//        注入的脚本能以本机信任身份调所有 /dsh-memory/* 写接口。
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
return c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":c==='"'?"&quot;":"&#39;"})}
// 🛑 后端用 {ok:false, error} 表示业务失败。只看 HTTP 状态会把它当成功数据渲染：
//    搜索挂了显示"没有命中"、项目读取挂了显示"一个项目都没有" —— 用户会以为记忆丢了。
// 🛑 必须带 x-dsh-memory-panel 这个自定义头 —— 后端的硬闸靠它挡跨站请求
//    （自定义头属于"非简单头"，恶意网页从别的站带不上来，带了就要 preflight，
//     而后端不应答 OPTIONS）。少这个头所有请求都会 401。
function get(u,ms){var ms2=ms||20000;
var ctl=(typeof AbortController!=="undefined")?new AbortController():null;
var timer=ctl?setTimeout(function(){ctl.abort()},ms2):null;
var opt={credentials:"same-origin",headers:{"x-dsh-memory-panel":"1"}};
if(ctl)opt.signal=ctl.signal;
return fetch(u,opt).then(function(r){
if(timer)clearTimeout(timer);
if(!r.ok)throw new Error("HTTP "+r.status);
return r.json().then(function(d){
if(d&&d.ok===false)throw new Error(d.error||"后端返回失败");
return d})}).catch(function(e){
if(timer)clearTimeout(timer);
// 🛑 超时也要说清楚：索引在重建时后端可能要跑十几秒，用户只看到"正在搜…"
//    永远转圈，会以为是死了。
if(e&&e.name==="AbortError")throw new Error("超时（"+(ms2/1000)+" 秒没响应，可能正在建索引，稍后再试）");
throw e})}
function renderStats(d){var g=$("#stats"),h="";
var order=["core","project","branch","detail"];
for(var i=0;i<order.length;i++){var k=order[i];
h+='<div class="cell"><b>'+(d.counts[k]||0)+'</b><span>'+esc(k)+'</span></div>'}
h+='<div class="cell"><b>'+d.projects+'</b><span>项目</span></div>';
h+='<div class="cell"><b>'+d.total+'</b><span>合计</span></div>';
g.innerHTML=h}
// 时间轴：按天把新增和改动铺开，看得出"哪一批是同一阶段的产物"
var TL={days:30,layers:'',only:''};
function tlFetch(){
var q="/dsh-memory/timeline?days="+TL.days;
if(TL.layers)q+="&layers="+encodeURIComponent(TL.layers);
if(TL.only)q+="&only="+TL.only;
$("#out").innerHTML='<div class="muted">正在读时间轴…</div>';
get(q,30000).then(renderTimeline).catch(function(e){
$("#out").innerHTML='<div class="err">时间轴读取失败：'+esc(e.message)+'</div>'});
}
function renderTimeline(d){
var opts=[['','全部'],['core','core'],['project','project'],['branch','branch'],['detail','detail']];
var h='<div class="tlbar">';

var convBusy=false;

var conv=$("#convchk")&&$("#convchk").checked;
if(!q&&!conv){var u="/dsh-memory/recent?n=15";
  get(u).then(function(d){renderHits(d.hits)}).catch(function(e){

if(conv){

  get(u2,90000).then(function(d){
    renderConvHits(d);unfreeze();
  }).catch(function(e){
    $("#out").innerHTML='<div class="err">历史对话检索失败：'+esc(e.message)+'</div>';unfreeze()});

var u3="/dsh-memory/search?q="+encodeURIComponent(q)+"&k=15"+
  (($("#qarch")&&$("#qarch").checked)?"&status=all":"");
get(u3).then(function(d){renderHits(d.hits)}).catch(function(e){
$("#out").innerHTML='<div class="err">检索失败：'+esc(e.message)+'</div>'})}
// 历史对话结果：每条带 session 尾号和消息序号，方便回原文
function renderConvHits(d){
  var st=d&&d.stats||{};
  var s=$("#convstat");
  if(s)s.textContent=st.msgs?("索引 "+st.msgs+" 条消息 / "+st.files+" 个会话"):"";
  var hits=(d&&d.hits)||[];
  if(!hits.length){$("#out").innerHTML='<div class="muted">历史对话里没找到这个说法</div>';return}
  var h="";
  for(var i=0;i<hits.length;i++){var r=hits[i];
    var t=r.time?new Date(r.time).toISOString().slice(0,16).replace("T"," "):"";
    h+='<div class="hit"><div class="top">'+
       '<span class="tag">'+esc(r.role)+'</span>'+
       '<span class="score">'+esc(String(r.sid).slice(-8))+' · seq '+r.seq+' · '+esc(t)+'</span>'+
       '</div><div class="body">'+esc(r.text)+'</div></div>'}
  $("#out").innerHTML=h;
  CUR=[];
}
$("#go").onclick=search;$("#q").onkeydown=function(e){if(e.key==="Enter")search()};

var CUR=[];
function renderHits(list){
  CUR=list||[];
  var o=$("#out");
  if(!CUR.length){o.innerHTML='<div class="muted">没有命中</div>';return}
  var h="";
  for(var i=0;i<CUR.length;i++){
    var it=CUR[i];
    // 层 + 分类一起显示（`detail/lesson`）：只给层的话，想筛「这个项目的教训」
    // 还得一条条点开才知道分工。
    var catTxt=it.level+(it.category?("/"+it.category):"");
    var meta=[];
    if(it.project)meta.push(esc(it.project));
    var when=it.at||it.updated_at||0;
    var dt=fmtLocalDT(when);
    if(dt)meta.push(esc(dt));
    var archived=(it.status&&it.status!=="active");
    if(archived)meta.push('<span class="arch">'+esc(it.status)+"</span>");
    h+='<div class="hit'+(archived?" isarch":"")+'"><div class="top"><span class="tag">'+esc(catTxt)+"</span>"+
      // 显示截断、但 title 里留完整 id —— 接口现在返回的是完整 id（以前被截成 24 位，
      // 导致长度 36/42 的老记忆拿去 update/delete 全 404）
      '<span class="muted" title="'+esc(it.id)+'">'+esc(String(it.id).slice(0,24))+"</span>"+
      (it.score!=null?'<span class="score">'+it.score.toFixed(2)+"</span>":"")+
      '<span class="acts">'+
      '<button data-edit="'+i+'">改</button>'+
      (archived
        ? '<button data-restore="'+i+'">恢复</button>'
        : '<button class="danger" data-del="'+i+'">删</button>')+
      "</span></div>"+
      '<div class="body">'+esc(it.content)+"</div>"+
      (meta.length?'<div class="hmeta">'+meta.join(" · ")+"</div>":"")+
      "</div>";
  }
  o.innerHTML=h;
}
function post(u,body){
  return fetch(u,{method:"POST",credentials:"same-origin",
    headers:{"content-type":"application/json","x-dsh-memory-panel":"1"},
    body:JSON.stringify(body)}).then(function(r){
      // 后端出错时可能返回纯文本（401 unauthorized / 500 堆栈），
      // 直接 .json() 会抛 "Unexpected token"，提示会变得莫名其妙
      if(!r.ok)return r.text().then(function(t){return {ok:false,error:"HTTP "+r.status+(t?": "+t.slice(0,120):"")}});
      return r.json();
    });
}
// 连点两条「改」，或者先点「＋新增」再等旧请求返回时，后回来的那个会把当前
// 编辑器**整个覆盖**，正在输入的内容被冲走。用序号令牌：只有最后一次点击的回包算数。
var edSeq=0;
function openEditor(it){
  if(!it){renderEditor(null);return}
  // 已有条目：**先取全文**再渲染。
  // /search 和 /recent 返回的是搜索结果片段：content 截到 220 字、没有 title/keywords/project。
  // 直接拿它填编辑器再保存，一次就丢掉标题和关键词、项目被改成「全局」、正文变成截断版
  // —— 不用任何恶意操作，点一下「改」再点「保存」就中。
  var my=++edSeq;
  get("/dsh-memory/entry?id="+encodeURIComponent(it.id)+"&level="+encodeURIComponent(it.level||""))
    .then(function(r){
      if(my!==edSeq)return;
      if(!r.ok){alert(r.error||"读不到这条记忆");return}
      renderEditor(r.entry);
    })
    .catch(function(e){if(my===edSeq)alert("读不到："+e.message)});
}
/** 毫秒 → 本地 YYYY-MM-DD（date 控件只认这个格式）。
 *  🛑 不能用 toISOString()：那是 UTC，UTC+8 下会把日子挪前一天。 */
function fmtLocalDate(ms){
  var d=new Date(Number(ms));
  if(isNaN(d.getTime()))return "";
  var y=String(d.getFullYear());
  while(y.length<4)y="0"+y;
  return y+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
}
/** 毫秒 → 本地「2026-11-19 11:20」。列表里显示时间一律用这个，
 *  🛑 别用 toISOString()——那是 UTC，本地会少 8 小时，看着像数据错乱。 */
function fmtLocalDT(ms){
  var n=Number(ms);
  if(!n||isNaN(n))return "";
  var d=new Date(n);
  var p=function(x){return ("0"+x).slice(-2)};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function renderEditor(it){
  ++edSeq;   // 编辑器一换，所有在途的 openEditor 请求都作废
  var isNew=!it;
  var lv=(it&&it.level)||"detail";
  var opts=["core","project","branch","detail"].map(function(x){
    return '<option value="'+x+'"'+(x===lv?" selected":"")+">"+x+"</option>"}).join("");
  // 项目：编辑时**别兜「全局」** —— 原本 null/空的归属被改成显式「全局」，
  // 会把「全局条目永远通过」的检索语义改掉。只有新增才默认「全局」。
  var pjVal=isNew?"全局":((it&&it.project!=null)?String(it.project):"");
  var h='<div class="ed"><div class="edh">'+(isNew?"新增记忆":"修改 "+esc(String(it.id).slice(0,24)))+"</div>";
  h+='<div class="edrow"><label>层</label><select id="edlv" '+(isNew?"":"disabled")+">"+opts+"</select>";
  h+='<label>项目</label><input id="edpj" value="'+esc(pjVal)+'"></div>';
  h+='<div class="edrow"><label>标题</label><input id="edti" value="'+esc((it&&it.title)||"")+'"></div>';
  h+='<div class="edrow"><label>正文</label></div>';
  h+='<textarea id="edct" rows="7">'+esc((it&&it.content)||"")+"</textarea>";
  // 关键词在库里是 JSON 字符串（["记忆","系统"]），直接塞进输入框的话，
  // 保存时后端按 [,，\s]+ 切分会把它切成 `["记忆"` / `"系统"]` 这种碎片，
  // 检索打分立刻被污染，而且是不可逆的。这里先解析成逗号分隔再显示。
  var kwText="";
  try{
    var kwRaw=it&&it.keywords;
    var kwArr=Array.isArray(kwRaw)?kwRaw:JSON.parse(kwRaw||"[]");
    if(Array.isArray(kwArr))kwText=kwArr.join(", ");
    else kwText=String(kwRaw||"");
  }catch(e){
    // 🛑 坏 JSON 不能原样回填：那段残缺的 `["a","b"` 塞进输入框，保存后后端按
    //    [,，\s]+ 切分会把它变成几个碎片关键词，越存越烂。退回空串让用户重填，
    //    比"看着有值、其实已经坏了"强。
    kwText="";
  }
  h+='<div class="edrow"><label>关键词</label><input id="edkw" placeholder="逗号或空格分隔" value="'+
     esc(kwText)+'"></div>';
  // ── 时间 / 情境 / 情绪（2026-11-19 加）────────────────────────
  // 工具层（memory_remember）早就能收这三样，面板一直没暴露 ⇒ 手动补的条目
  // 全是"没有时间感"的，时间轴上只能用记录时间冒充发生时间。
  //
  // 🛑 回填必须**同时记住原始值**（hdRaw / cxRaw）。这两个控件都是有损显示：
  //    日期只到「天」、JSON 情境被拍成人话。保存时若无条件回写，
  //    「10:30 的时刻」和「{scene,task} 的结构」会被静默抹掉 —— 只改个标题也会中。
  var hdRaw=null;
  if(it&&it.happened_at!=null&&it.happened_at!==""){
    var hn=Number(it.happened_at);
    // 0 视同未填：normalizeTime(0) 会存 0，渲染出来是 1970-01-01，像脏数据
    if(Number.isFinite(hn)&&hn>0)hdRaw=hn;
  }
  var hdShown=hdRaw==null?"":fmtLocalDate(hdRaw);
  var cxRaw=(it&&it.context!=null)?String(it.context):"";
  var cxShown=cxRaw;
  if(cxRaw){
    try{
      var cxO=JSON.parse(cxRaw);
      if(cxO&&typeof cxO==="object"&&!Array.isArray(cxO)){
        var cparts=[cxO.scene,cxO.task,cxO["with"],cxO.where].filter(Boolean);
        // 有已知键才拼成人话；一个都没有就原样显示 JSON
        // （回填成空串的话，用户一保存就把整段情境清光了）
        if(cparts.length)cxShown=cparts.join(" / ");
      }
    }catch(e){/* 纯文本，原样显示 */}
  }
  var mdLabel="",mdIv=0.5,mdSrc=isNew?"explicit":"inferred",mdConf=null;
  var md=it&&it.mood;
  if(md){
    var mdO=md,mParseErr=false;
    if(typeof md==="string"){try{mdO=JSON.parse(md)}catch(e){mParseErr=true}}
    if(mParseErr){
      // 解析失败把原文塞进标签框，别静默清空（外部改坏了也能看见）
      mdLabel=String(md).slice(0,60);
    }else if(mdO&&typeof mdO==="object"){
      mdLabel=mdO.label||"";
      // 🛑 不能直接 Number()：Number(null)===0、Number("")===0，
      //    「没设强度」会被回填成强度 0，一保存就把原值改成 0。
      if(mdO.intensity!=null&&mdO.intensity!==""){
        var iv=Number(mdO.intensity);
        if(Number.isFinite(iv))mdIv=Math.max(0,Math.min(1,iv));
      }
      if(mdO.confidence!=null&&mdO.confidence!==""){
        var cf=Number(mdO.confidence);
        if(Number.isFinite(cf))mdConf=Math.max(0,Math.min(1,cf));
      }
      // 🛑 只有明确写着 explicit 才算「他明说的」。缺失/写错/大写一律按 inferred ——
      //    反过来（非 inferred 就当 explicit）会把一条老条目静默改标成
      //    「用户亲口说的」，这是最不能默认的方向。
      mdSrc=mdO.source==="explicit"?"explicit":"inferred";
    }
  }
  h+='<div class="edrow"><label>发生</label><input type="date" id="eddh" value="'+esc(hdShown)+'">'+
     '<span class="hint">不填就按记录时间算</span></div>';
  h+='<div class="edrow"><label>情境</label><input id="edcx" placeholder="改 dsh-memory 时 / 深夜排障" value="'+esc(cxShown)+'"></div>';
  h+='<div class="edrow"><label>情绪</label><input id="edmd" placeholder="如 焦虑、满意" value="'+esc(mdLabel)+'">'+
     '<span class="mdctl"><input type="range" id="edmi" min="0" max="1" step="0.05" value="'+mdIv+'" title="强度">'+
     '<select id="edms">'+
     '<option value="explicit"'+(mdSrc==="explicit"?" selected":"")+'>他明说的</option>'+
     '<option value="inferred"'+(mdSrc==="inferred"?" selected":"")+'>我推断的</option>'+
     '</select></span></div>';
  h+='<div class="edrow">';
  if(isNew)h+='<label><input type="checkbox" id="edfc"> 强制（跳过查重）</label>';
  h+='<button id="edsave">保存</button><button id="edcancel">取消</button></div>';
  h+='<div id="edmsg" class="err"></div></div>';
  $("#editor").innerHTML=h;
  // 失败提示要能挂住：用户点保存后立刻点取消时 #editor 已清空、#edmsg 脱离文档，
  // 往它写文字等于对着空气报错 —— 那就退回 alert，别把失败吞掉。
  function showMsg(text){
    var m=document.getElementById("edmsg");
    if(m&&m.isConnected){m.textContent=text;return}
    alert(text);
  }
  $("#edcancel").onclick=function(){$("#editor").innerHTML=""};
  $("#edsave").onclick=function(){
    var btn=this;
    if(btn&&btn.disabled)return;
    if(btn)btn.disabled=true;   // 防连点：编辑时第二个回包会覆盖，新增时白建两条
    var body={
      level:$("#edlv").value,
      title:$("#edti").value.trim(),
      content:$("#edct").value,
      keywords:$("#edkw").value,
    };
    // core 表没有 project 列 —— 提交上去就是 no such column 直接 500
    if(body.level!=="core"){
      var pj=$("#edpj").value.trim();
      // 编辑时空就传空（后端存 null），别兜成「全局」把原归属改掉
      body.project=isNew?(pj||"全局"):pj;
    }
    // 时间 / 情境 / 情绪
    // 编辑时**总是传**（空串 = 清空）；新增时非空才传，免得每条塞一堆 null。
    // 但「没动过」和「清空」是两种意图，得分开：
    //   没动过 → 回传**原始值**（保住毫秒时刻 / JSON 结构）
    //   动过或清空 → 传框里的字符串（空串即清空）
    var dhv=$("#eddh").value.trim();
    if(hdRaw!=null&&dhv===hdShown)body.happened_at=hdRaw;
    else if(dhv||!isNew)body.happened_at=dhv;
    var cxv=$("#edcx").value.trim();
    if(cxRaw&&cxv===cxShown)body.context=cxRaw;
    else if(cxv||!isNew)body.context=cxv;
    // 情绪：confidence 不回带的话，每保存一次就丢一次
    var mdv=$("#edmd").value.trim();
    if(mdv){
      var mo={label:mdv,intensity:Number($("#edmi").value),source:$("#edms").value};
      if(mdConf!=null)mo.confidence=mdConf;
      body.mood=mo;
    }else if(!isNew)body.mood="";
    var url,payload;
    if(isNew){
      payload=body;
      if($("#edfc")&&$("#edfc").checked)payload.force=true;
      url="/dsh-memory/item/add";
    }else{
      body.id=it.id;body.level=it.level;
      url="/dsh-memory/item/update";
      payload=body;
    }
    post(url,payload).then(function(r){
      if(!r.ok){showMsg(r.error||"保存失败");if(btn)btn.disabled=false;return}
      $("#editor").innerHTML="";
      ++edSeq;   // 编辑器关了，在途的 openEditor 回包也别再覆盖
      search();load();
    }).catch(function(e){showMsg("保存失败："+e.message);if(btn)btn.disabled=false});
  };
}
document.getElementById("out").addEventListener("click",function(e){
  var b=e.target.closest?e.target.closest("button"):null;
  if(!b)return;
  if(b.getAttribute("data-edit")!=null){
    var it2=CUR[Number(b.getAttribute("data-edit"))];
    // 越界保护：CUR 已经被新的 renderHits 换掉、DOM 还是旧按钮时，
    // undefined 进 openEditor 会弹出一个空白的「新增记忆」框，用户以为条目被清了。
    if(!it2)return;
    openEditor(it2);
    return;
  }
  if(b.getAttribute("data-del")!=null){
    var it=CUR[Number(b.getAttribute("data-del"))];
    if(!it)return;
    if(!confirm("把这条移出检索？\n\n"+String(it.content).slice(0,80)+"…\n\n（默认只归档，不物理删除）"))return;
    post("/dsh-memory/item/delete",{id:it.id,level:it.level}).then(function(r){
      if(!r.ok){alert(r.error||"删除失败");return}
      search();load();
    }).catch(function(err){alert("删除失败："+err.message)});
    return;
  }
  // 「恢复」：把 status 改回 active。
  // 🛑 没有这个按钮的话，「删」就是单向的 —— 条目变成 archived 之后
  //    面板既看不到（搜索默认只查 active）也没法救回来，
  //    用户点完会以为数据没了（2026-11-19 用户体验测试发现）。
  if(b.getAttribute("data-restore")!=null){
    var itR=CUR[Number(b.getAttribute("data-restore"))];
    if(!itR)return;
    post("/dsh-memory/item/update",{id:itR.id,level:itR.level,status:"active"}).then(function(r){
      if(!r.ok){alert(r.error||"恢复失败");return}
      search();load();
    }).catch(function(err){alert("恢复失败："+err.message)});
    return;
  }
});


var CURSID="global";
function withSid(u){return u+(u.indexOf("?")>=0?"&":"?")+"session="+encodeURIComponent(CURSID)}
function renderProjects(d){
  // 🛑 只在"还没选过窗口"时接受后端挑的那个会话。
  //    原来无条件回写 ⇒ 一个慢的旧响应就能把 CURSID 拽回上一个窗口，
  //    之后点锁定、点开关全都作用在错的窗口上（而下拉里显示的又是对的）。
  if(d&&d.sessionId&&(!CURSID||CURSID==="global"))CURSID=d.sessionId;
  var ps=(d&&d.projects)||[];
  var sess=(d&&d.sessions)||[];
  var lock=!!(d&&d.locked);
  var have=false,i;
  for(i=0;i<sess.length;i++)if(sess[i].id===CURSID)have=true;
  if(!have)sess=[{id:CURSID,title:CURSID.slice(-12)}].concat(sess);
  var on=[],off=[],p,loaded;
  for(i=0;i<ps.length;i++){
    p=ps[i];
    // 「已加载」= **当前活跃**（missRounds 有值）或手动锁住。
    // 🛑 2026-11-18 改：以前用 p.injected 判断，但那是"内容进过上下文"的记录，
    //    重启后照样是 true ⇒ 面板永远显示一堆"已加载"，用户问
    //    「好几轮没提工作台，它怎么还在上面」。现在按活跃度显示。
    loaded=(p.missRounds!=null||p.mode==="on");
    (loaded?on:off).push(p);
  }
  // 按父子层级排：父项目后面紧跟它的子项目（缩进显示）
  function byTree(list){
    var kids={},roots=[],i2,j2,n2;
    for(i2=0;i2<list.length;i2++){
      n2=list[i2];
      if(n2.parent&&list.some(function(x){return x.name===n2.parent}))(kids[n2.parent]=kids[n2.parent]||[]).push(n2);
      else roots.push(n2);
    }
    var out=[];
    for(i2=0;i2<roots.length;i2++){
      out.push(roots[i2]);
      var ch=kids[roots[i2].name]||[];
      for(j2=0;j2<ch.length;j2++){ch[j2]._child=true;out.push(ch[j2])}
    }
    // 父项目不在这一组的孤立子项目，补在末尾
    for(var k in kids)for(j2=0;j2<kids[k].length;j2++)if(out.indexOf(kids[k][j2])<0)out.push(kids[k][j2]);
    return out;
  }
  on=byTree(on);off=byTree(off);
  function row(x){
    // 打勾 = 当前活跃（有 missRounds）或手动锁住；跟上面 on/off 分组用同一套判据
    var on2=(x.missRounds!=null||x.mode==="on");
    // data-mode 是给点击逻辑用的：要知道这一行现在是 auto / on / off 才能算"下一个状态"
    var s='<div class="pitem'+(on2?" on":"")+(x._child?" child":"")+'" data-n="'+esc(x.name)+'" data-mode="'+esc(x.mode||"auto")+'">';
    s+='<span class="box">'+(on2?"✓":"")+"</span>";
    if(x._child)s+='<span class="br">└</span>';
    s+='<span class="nm">'+esc(x.name)+"</span>";
    s+='<span class="sz">'+(x.fileOk?x.size+" 字":"没写文件")+"</span>";
    // 🕒 回落倒计时（2026-11-18 用户要的：不显示的话不知道到底什么情况）
    //    规则来自 project-core.js 的衰减段：一轮不提 miss+1，m > maxMiss 就摘。
    //    所以真正能扛 maxMiss+1 轮，显示的是"再几轮不提就掉"。
    //    missRounds 为 null = 不在激活集（未加载那半区）或者钉住了，都不显示倒计时。
    // 锁住的不显示倒计时标签 —— 右边的 🔒 已经说明了"它不会再自动变"
    if(x.mode==="on"||x.mode==="off"){
      // 什么都不加
    }else if(x.missRounds!=null){
      var lim=((d&&d.maxMissTurns)||3)+1;
      var left=lim-x.missRounds;
      if(left<1)left=1;
      s+='<span class="cd'+(left<=1?" warn":"")+'" title="已连续 '+x.missRounds+' 轮没提到它；再 '+left+" 轮不提就自动摘掉\">余 "+left+" 轮</span>";
    }else if(x.injected===true){
      // 不活跃了，但正文还在对话历史里（重启/掉出活跃集都不会把它从历史里拿走）
      s+='<span class="cd" title="这个项目的核心正文已经在当前对话历史里，不会再重复灌一遍；提到关键词会重新计入活跃">已注入过</span>';
    }
    // 锁按钮：**每行都有**，跟勾没勾无关。
    //   🔓 = 跟关键词走（关键词说了算）    🔒 = 固定住当前这个勾选状态
    // 之前把"能不能锁"绑在"有没有勾"上，导致没勾的时候没法锁，那是错的。
    var locked=(x.mode==="on"||x.mode==="off");
    s+='<button class="lockbtn'+(locked?" on":"")+'" data-lock="'+esc(x.name)+'" title="'+
       (locked?"已固定住，点一下回到跟关键词自动":"现在是跟关键词自动，点一下把当前状态固定住")+
       '">'+(locked?"🔒":"🔓")+'</button>';
    s+='<button class="editbtn" data-edit="'+esc(x.name)+'" title="改这个项目的核心正文">改</button>';
    return s+"</div>";
  }
  var h='<div class="phead"><b>项目核心</b><span class="pbtns">'+
    '<button id="newproj">＋新建</button>'+
    '<button id="lockbtn" class="'+(lock?"on":"")+'">'+(lock?"🔒 已锁定":"🔓 锁定当前状态")+"</button></span></div>";
  // 窗口选择：自定义下拉，不用 <select>。
  // 🛑 原生 select 展开时是**系统渲染的白底深字**，在暗色面板上特别跳，
  //    而且会把下面的项目列表整个盖住（Windows 上 <option> 的底色基本不受 CSS 控制）。
  var curTitle = "（默认 / 无会话）";
  for(i=0;i<sess.length;i++) if(sess[i].id===CURSID) curTitle = sess[i].title||sess[i].id;
  h+='<div class="srow"><label>窗口</label><div class="sel" id="sessel">';
  h+='<div class="selbtn" id="selbtn"><span class="seltxt">'+esc(curTitle)+'</span><span class="selar">▾</span></div>';
  h+='<div class="sellist" id="sellist">';
  for(i=0;i<sess.length;i++){
    h+='<div class="selopt'+(sess[i].id===CURSID?" cur":"")+'" data-id="'+esc(sess[i].id)+'" title="'+
       esc(sess[i].title||sess[i].id)+'">'+esc(sess[i].title||sess[i].id)+"</div>";
  }
  h+="</div></div></div>";
  h+='<div class="prule">'+(lock
    ? "已冻结整个集合：不再按关键词增减，但仍照常注入"
    : "方框 = 要不要注入（勾上就带进对话）；右边的锁 🔓 = 跟关键词自动 / 🔒 = 固定住，任何时候都能点")+"</div>";
  h+='<div class="plabel">已加载 '+on.length+"</div>";
  if(!on.length)h+='<div class="pempty">（这个窗口当前没有加载任何项目核心）</div>';
  for(i=0;i<on.length;i++)h+=row(on[i]);
  h+='<div class="plabel">未加载 '+off.length+"</div>";
  for(i=0;i<off.length;i++)h+=row(off[i]);
  $("#proj").innerHTML=h;
  // 渲染成功就把上次的错误条清掉
  var eb2=document.getElementById("projerr");
  if(eb2)eb2.textContent="";
  var lb=$("#lockbtn");
  if(lb)lb.onclick=function(){
    get(withSid("/dsh-memory/projects/lock?on="+(lock?"0":"1"))).then(function(r){
      // 递增序号让在飞的轮询请求作废，否则旧数据后到会把按钮刷回原状态
      if(r&&r.snapshot){projSeq++;renderProjects(r.snapshot)}else loadProjects();
    }).catch(function(e){alert("锁定失败："+e.message)});
  };
  var se=$("#sessel"), sbtn=$("#selbtn"), slist=$("#sellist");
  if(sbtn && slist){
    sbtn.onclick=function(e){ e.stopPropagation(); slist.classList.toggle("open") };
    slist.onclick=function(e){
      var t=e.target.closest?e.target.closest(".selopt"):null;
      if(!t) return;
      var sid=t.getAttribute("data-id");
      slist.classList.remove("open");
      if(sid!==CURSID){ CURSID=sid; loadProjects() }
    };
  }
  var nb=$("#newproj");
  if(nb)nb.onclick=function(e){e.stopPropagation();openNewProject()};
}
var projSeq=0;
function loadProjects(){
  var seq=++projSeq;
  // ⚠️ 第一次加载**不能**带 session 参数 —— 带了就等于主动选 'global'，
  //    后端那个"默认挑最近会话"的逻辑就永远走不到（实测踩到：下拉一直停在「默认/无会话」）。
  var u = (CURSID && CURSID !== "global") ? withSid("/dsh-memory/projects") : "/dsh-memory/projects";
  get(u).then(function(d){
    // 🛑 过期响应直接丢掉：轮询 / 切窗口 / 点锁定 三路并发时，
    //    慢的旧响应会把界面拽回上一个窗口的状态。
    if(seq!==projSeq)return;
    renderProjects(d);
  }).catch(function(e){
    if(seq!==projSeq)return;
    showProjErr(e);
  });
}
function showProjErr(e){
  // 错误信息**不占 #proj 主容器** —— 那里面还有标题/窗口下拉/锁定/新建三个控件，
  // 一冲掉就只能刷新整个面板才能恢复（而且轮询一旦停就更救不回来）。
  var b=document.getElementById("projerr");
  if(!b){
    b=document.createElement("div");
    b.id="projerr";b.className="err";b.style.margin="0 0 10px";
    var host=document.getElementById("proj");
    if(host&&host.parentNode)host.parentNode.insertBefore(b,host);
  }
  b.textContent="项目核心读取失败："+e.message+"（8 秒后自动重试）";
}
document.getElementById("proj").addEventListener("click",function(e){
  // 「改」按钮先拦下来：它在 .pitem 里面，不拦会同时触发项目开关
  var eb=e.target.closest?e.target.closest("button[data-edit]"):null;
  if(eb){e.stopPropagation();openProjEditor(eb.getAttribute("data-edit"));return}
  // 🔒 锁按钮：每行都有，跟勾没勾无关
  //   🔓（auto）→ 点一下 = 把当前勾选状态固定住
  //   🔒（on/off）→ 点一下 = 回到跟关键词自动
  var lb2=e.target.closest?e.target.closest("button[data-lock]"):null;
  if(lb2){
    e.stopPropagation();
    var ln=lb2.getAttribute("data-lock");
    var lrow=lb2.closest(".pitem");
    var lcur=(lrow&&lrow.getAttribute("data-mode"))||"auto";
    var lshot=(lrow&&lrow.className.indexOf("on")>=0);
    var lnext=(lcur==="auto")?(lshot?"on":"off"):"auto";
    get(withSid("/dsh-memory/projects/set?name="+encodeURIComponent(ln)+"&mode="+lnext)).then(function(r){
      if(r&&r.snapshot){projSeq++;renderProjects(r.snapshot)}else loadProjects();
    }).catch(function(err){alert("锁定失败："+err.message)});
    return;
  }
  // 只有前面那个方框是开关。整行不再是点击区 ——
  // 以前点整行，点「放开」「改」附近的手滑就会连带触发开关，按钮看着也像被压住。
  var boxEl=e.target.closest?e.target.closest(".pitem .box"):null;
  if(!boxEl)return;
  var it=boxEl.closest(".pitem");
  if(!it)return;
  var n=it.getAttribute("data-n");
  var cur=it.getAttribute("data-mode")||"auto";
  var loaded=it.className.indexOf("on")>=0;
  // 方框 = 要不要注入：勾着就取消（off），没勾就勾上（on）。跟"锁不锁"无关。
  var next = loaded ? "off" : "on";
  get(withSid("/dsh-memory/projects/set?name="+encodeURIComponent(n)+"&mode="+next)).then(function(r){
    if(r&&r.snapshot){projSeq++;renderProjects(r.snapshot)}else loadProjects();
  }).catch(function(err){alert("切换失败："+err.message)});
});
// 编辑某项目的核心正文：读 → textarea → 写回
// 新建一个项目核心：填名字 + 关键词，插件写好 projects.json 和初始 md
function openNewProject(){
  var box=document.getElementById("pedit");
  if(!box){box=document.createElement("div");box.id="pedit";
    var host=document.getElementById("proj");
    host.parentNode.insertBefore(box,host);}
  box.innerHTML="";
  var head=document.createElement("div");head.className="edh";head.textContent="新建项目核心";
  var r1=document.createElement("div");r1.className="edrow";
  var l1=document.createElement("label");l1.textContent="项目名";
  var i1=document.createElement("input");i1.id="np-name";i1.placeholder="例：我的项目";
  r1.appendChild(l1);r1.appendChild(i1);
  var r2=document.createElement("div");r2.className="edrow";
  var l2=document.createElement("label");l2.textContent="关键词";
  var i2=document.createElement("input");i2.id="np-kw";i2.placeholder="逗号或空格分隔。写「你实际会怎么说」，不是项目名";
  r2.appendChild(l2);r2.appendChild(i2);
  var r3=document.createElement("div");r3.className="edrow";
  var l3=document.createElement("label");l3.textContent="初始内容";
  r3.appendChild(l3);
  var ta=document.createElement("textarea");ta.id="np-ct";ta.rows=8;
  ta.value="# 项目名 · 项目核心\n\n> 只写「不知道就会做错」的东西。背景、历史、代码说明不要放这里。\n\n## 坑\n- （这一条不看会怎么出错？）\n"
  var r4=document.createElement("div");r4.className="edrow";
  var save=document.createElement("button");save.textContent="创建";save.id="npsave";
  var cancel=document.createElement("button");cancel.textContent="取消";
  var msg=document.createElement("span");msg.className="err";
  r4.appendChild(save);r4.appendChild(cancel);r4.appendChild(msg);
  var wrap=document.createElement("div");wrap.className="ed";
  wrap.appendChild(head);wrap.appendChild(r1);wrap.appendChild(r2);wrap.appendChild(r3);
  wrap.appendChild(ta);wrap.appendChild(r4);
  box.appendChild(wrap);
  i1.focus();
  cancel.onclick=function(){box.remove()};
  save.onclick=function(){
    var nm=i1.value.trim();
    if(!nm){msg.textContent="项目名不能为空";return}
    fetch("/dsh-memory/projects/create",{method:"POST",credentials:"same-origin",
      headers:{"content-type":"application/json","x-dsh-memory-panel":"1"},
      body:JSON.stringify({name:nm,keywords:i2.value,content:ta.value})})
    .then(function(x){return x.json()})
    .then(function(d){
      if(!d.ok){msg.textContent=d.error||"创建失败";return}
      box.remove();loadProjects();
    }).catch(function(err){msg.textContent="创建失败："+err.message});
  };
}
function openProjEditor(name){
  get("/dsh-memory/projects/file?name="+encodeURIComponent(name)).then(function(r){
    if(!r.ok){alert(r.error||"读不到");return}
    var LIMIT=r.limit||1500;
    var box=document.getElementById("pedit");
    if(!box){box=document.createElement("div");box.id="pedit";
      var host=document.getElementById("proj");
      host.parentNode.insertBefore(box,host);}
    box.innerHTML="";
    var head=document.createElement("div");head.className="edh";
    head.textContent="编辑项目核心："+name+"（"+r.file+"，上限 "+LIMIT+" 字符）";
    var ta=document.createElement("textarea");ta.rows=14;ta.value=r.content||"";
    // 边打字边报字数：超了注入会被截断，等发现内容少一半再回头查太贵
    var cnt=document.createElement("div");cnt.className="muted";
    function refresh(){
      var n=ta.value.length,pct=LIMIT?Math.round(n*100/LIMIT):0;
      if(n>LIMIT){
        cnt.textContent="⚠️ "+n+"/"+LIMIT+"，超 "+(n-LIMIT)+" 字符 —— 注入时只给前 "+LIMIT+" 个，后半段读不到";
        cnt.style.color="#f85149";
      }else if(n>=Math.floor(LIMIT*0.85)){
        cnt.textContent="⚠️ "+n+"/"+LIMIT+"（"+pct+"%）—— 快满了，再往里加就该压缩";
        cnt.style.color="#d29922";
      }else{
        cnt.textContent=n+"/"+LIMIT+"（"+pct+"%），余量 "+(LIMIT-n);
        cnt.style.color="";
      }
    }
    var row=document.createElement("div");row.className="edrow";
    var save=document.createElement("button");save.textContent="保存";save.id="psave";
    var cancel=document.createElement("button");cancel.textContent="取消";
    var msg=document.createElement("span");msg.className="err";
    row.appendChild(save);row.appendChild(cancel);row.appendChild(msg);
    var wrap=document.createElement("div");wrap.className="ed";
    wrap.appendChild(head);wrap.appendChild(ta);wrap.appendChild(cnt);wrap.appendChild(row);
    box.appendChild(wrap);
    ta.oninput=refresh;
    refresh();
    cancel.onclick=function(){box.remove()};
    save.onclick=function(){
      fetch("/dsh-memory/projects/file",{method:"POST",credentials:"same-origin",
        headers:{"content-type":"application/json","x-dsh-memory-panel":"1"},
        body:JSON.stringify({name:name,content:ta.value})})
      .then(function(x){return x.json()})
      .then(function(d){
        if(!d.ok){msg.textContent=d.error||"保存失败";return}
        if(d.warn){
          // 存是存进去了，但超了/快满了 —— 不关编辑器，让提示一直挂在眼前
          msg.textContent=d.warn;msg.style.color=(d.chars>d.limit)?"#f85149":"#d29922";
          refresh();loadProjects();return;
        }
        box.remove();loadProjects();
      }).catch(function(err){msg.textContent="保存失败："+err.message});
    };
    ta.focus();
  }).catch(function(e){alert("读不到："+e.message)});
}

$("#addbtn").onclick=function(){openEditor(null)};
load();loadProjects();search();
setTimeout(function(){try{syncTheme()}catch(e){}try{syncBackdrop()}catch(e){}},60);
// 🕒 倒计时会随对话轮次往前走，所以面板开着时隔一会儿静默刷一次项目区，
//    不用用户手动点。两条保护：
//      ① 页面在后台（切走了）就不刷，省得白耗；
//      ② 有任何编辑器开着就不刷 —— 项目正文编辑器(#pedit) / 条目编辑器(#editor)，
//         否则刷新会把人家正在输入的东西冲掉。
setInterval(function(){
  try{
    if(document.hidden)return;
    // 🛑 门禁判的是「里面还有没有正在编的东西」，不是「元素在不在」。
    //    #pedit 只在第一次创建，取消/保存时原来只清 innerHTML、元素永远留在文档里
    //    ⇒ 只要点过一次「＋新建」或某个项目的「改」（哪怕马上取消），
    //    这个 return 就永远命中，轮询彻底死掉：倒计时、已注入过、锁定状态全部冻结。
    var pdBox=document.getElementById("pedit");
    if(pdBox&&pdBox.innerHTML)return;
    var ed=document.getElementById("editor");
    if(ed&&ed.innerHTML)return;
    loadProjects();
  }catch(e){}
},8000);
